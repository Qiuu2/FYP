  unique_assignment: true
  double_count_sensitivity: true
  pending_case_log: config/company_pending_cases.csv

patent_assignee_split:
  university: TAI-质量
  company: IDI-创新
  public_rd: 第三类单列（InnoHK/应科院等；占比>10% 时并入敏感性分析）

